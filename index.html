<!DOCTYPE html>
<html>
<head>
    <title>Result Portal</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; }
        .box { max-width: 600px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; }
        h2 { text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; }
        .note { font-size: 13px; color: gray; text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h2>Student Result Portal</h2>
    <input type="text" placeholder="Enter Register Number">
    <button>View Result</button>
    <p class="note">Results are for temporary viewing only.</p>
</div>
</body>
</html>
